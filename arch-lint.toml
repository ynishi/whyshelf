#:schema https://raw.githubusercontent.com/ynishi/arch-lint/v0.11.0/schema/arch-lint.schema.json
#
# Architecture rules, run by `cargo test` (crates/whyshelf-core/tests/architecture.rs).
# When a review catches a structural mistake, add the rule here so it is never caught by hand again.
# A layer that does not fit is deleted together with its scope below.
#
# Scope paths are relative to this file's directory (the workspace root). `crate::`, `self::` and
# `super::` in a member crate resolve against that crate's `src/` (arch-lint 0.10+), so one file
# here covers every crate under crates/. References across crates (`use other_crate::..`) are not
# followed: a rule between crates is a `[dependencies]` decision, not an arch-lint one.

preset = "recommended"

[rules.no-sync-io]
# whyshelf-infra runs on an async runtime (tokio), so blocking I/O there stalls the executor. The rule
# is a built-in one that looks at every file under the workspace root, not at a scope.
enabled = true

[[scopes]]
name = "domain"
paths = ["crates/whyshelf-core/src/domain/**"]

[[scopes]]
name = "app"
paths = ["crates/whyshelf-core/src/app/**"]

[[scopes]]
name = "infra"
paths = ["crates/whyshelf-infra/src/**"]

# The boundary between whyshelf-core and whyshelf-infra is not a scope rule: whyshelf-core has no I/O
# crate in its [dependencies], so core cannot reach infra. That boundary is kept in Cargo.toml.

# Top layer first. app may use domain, domain uses neither.
[[layering]]
name = "core-layers"
order = ["app", "domain"]
message = "core depends inward only: app -> domain."

[[restrict-use]]
name = "pure-domain"
scope = "domain"
deny = [
    "std::fs", "std::fs::**",
    "std::process", "std::process::**",
    "std::env", "std::env::**",
    "std::net", "std::net::**",
    "std::time::SystemTime", "std::time::Instant",
    "tokio::fs", "tokio::fs::**", "tokio::process", "tokio::process::**", "tokio::net", "tokio::net::**",
    "rand", "rand::**", "git2", "git2::**", "reqwest", "reqwest::**",
    "chrono::Utc::now", "chrono::Local::now",
    "uuid::Uuid::now_v7", "uuid::Uuid::new_v4",
    "jiff::Timestamp::now", "jiff::Zoned::now",
    "serde", "serde::**", "serde_json", "serde_json::**",
]
message = "domain is pure: take I/O, time and randomness as values, or through a port of app implemented in whyshelf-infra. Wire formats (serde) belong to whyshelf-infra."

[[restrict-use]]
name = "no-io-in-app"
scope = "app"
deny = [
    "std::fs", "std::fs::**",
    "std::process", "std::process::**",
    "std::env", "std::env::**",
    "std::net", "std::net::**",
    "std::time::SystemTime", "std::time::Instant",
    "tokio::fs", "tokio::fs::**", "tokio::process", "tokio::process::**", "tokio::net", "tokio::net::**",
    "rand", "rand::**", "git2", "git2::**", "reqwest", "reqwest::**",
    "chrono::Utc::now", "chrono::Local::now",
    "uuid::Uuid::now_v7", "uuid::Uuid::new_v4",
    "jiff::Timestamp::now", "jiff::Zoned::now",
    "serde", "serde::**", "serde_json", "serde_json::**",
]
message = "app reaches the outside world through its ports; implement them in whyshelf-infra. Wire formats (serde) belong there too."

# The ports the use cases see of the artifacts are answered by the dispatch of the core
# (`Spaces`), and by nothing in whyshelf-infra: an adapter implements `SpaceAdapter`. The
# rule sees a `use` and a path written in full (`impl whyshelf_core::app::shelf::ArtifactSource
# for ..`), test code included; a file of tests only (`tests.rs`, `*_tests.rs`) is left out,
# as it may ask through the ports, and so is a line marked with a reason.
[[scopes]]
name = "infra-not-tests"
paths = ["crates/whyshelf-infra/src/**"]
exclude = ["crates/whyshelf-infra/src/**/tests.rs", "crates/whyshelf-infra/src/**/*_tests.rs"]

# The registry of the adapters holds a list and two matches, and no rule: an answer of
# its own (for a space with no adapter, or an ask not answered) is the core's.
[[scopes]]
name = "registry"
paths = ["crates/whyshelf-infra/src/shelf/artifact/registry.rs"]

[[restrict-use]]
name = "ports-by-the-dispatch"
scope = "infra-not-tests"
deny = [
    "whyshelf_core::app::shelf::ArtifactSource", "whyshelf_core::app::shelf::ArtifactSource::**",
    "whyshelf_core::app::shelf::MoveSource", "whyshelf_core::app::shelf::MoveSource::**",
    "whyshelf_core::app::shelf::ports::ArtifactSource", "whyshelf_core::app::shelf::ports::ArtifactSource::**",
    "whyshelf_core::app::shelf::ports::MoveSource", "whyshelf_core::app::shelf::ports::MoveSource::**",
]
message = "the dispatch of the core (Spaces) answers ArtifactSource and MoveSource: an adapter implements SpaceAdapter and the small traits of the asks it answers."

[[restrict-use]]
name = "registry-holds-no-rule"
scope = "registry"
deny = [
    "whyshelf_core::domain::shelf::artifact::SpacePrefixes", "whyshelf_core::domain::shelf::artifact::SpacePrefixes::**",
    "whyshelf_core::domain::shelf::ledger::SpaceSuggestions", "whyshelf_core::domain::shelf::ledger::SpaceSuggestions::**",
    "whyshelf_core::domain::shelf::artifact::ArtifactReading", "whyshelf_core::domain::shelf::artifact::ArtifactReading::**",
]
message = "the registry hands an ask to an adapter and answers none itself: the answers for a space with no adapter and for an ask not answered are the dispatch's, in the core."

[[restrict-use]]
name = "async-infra"
scope = "infra"
deny = [
    "anyhow", "anyhow::**",
    "std::process::Command",
]
message = "infra errors are thiserror enums with the cause kept, and a child process is started with tokio::process."
