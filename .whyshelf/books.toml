# The books of whyshelf's own requirements, decisions and verifications.

# A link to artifacts that names no preset and no space takes the file adapter's
# built-in preset `file`: files of the repository, by path.
[defaults]
artifact = "file"

[[book]]
name = "finding"
dir = "books/finding"
key = { prefix = "F" }
description = "what was seen: a root cause, evidence"
[[book.field]]
name = "title"
type = "text"
required = true
[[book.field]]
name = "source"
type = "text"

[[book]]
name = "requirement"
dir = "books/requirement"
key = { prefix = "REQ" }
description = "what is needed, and why"
[[book.field]]
name = "title"
type = "text"
required = true
[[book.field]]
name = "issues"             # the issues of the repository it answers, as `#<number>`
type = "list"
[[book.link]]
name = "grounds"            # informs: a finding fixed and retired must not break what it grounded
target = "finding"
means = "informs"
cover = "warn"              # every finding is expected to ground a requirement; one that does not yet is listed, not a failure
[[book.link]]
name = "replaces"
target = "requirement"
count = "optional"
means = "replaces"

[[book]]
name = "decision"
dir = "books/decision"
key = { prefix = "DEC" }
description = "how it is met, and what was rejected"
[[book.field]]
name = "title"
type = "text"
required = true
[[book.field]]
name = "rejected"
type = "list"
[[book.field]]
name = "revisit"
type = "text"
[[book.field]]
name = "rustdoc"            # where the contract is written (rustdoc item paths)
type = "list"
[[book.field]]
name = "issues"             # the issues of the repository it answers, as `#<number>`
type = "list"
[[book.link]]
name = "serves"             # depends: a changed requirement makes the decision stale
target = "requirement"
count = "at-least-one"
means = "depends"
cover = true                # every requirement is expected to have a decision that serves it
[[book.link]]
name = "related"
target = "decision"
means = "informs"
[[book.link]]
name = "replaces"
target = "decision"
count = "optional"
means = "replaces"

[[book]]
name = "verification"
dir = "books/verification"
key = { prefix = "V" }
description = "how a decision is checked"
[[book.field]]
name = "title"
type = "text"
required = true
[[book.field]]
name = "method"
type = { enum = ["e2e", "unit", "review"] }
required = true
[[book.link]]
name = "tests"              # depends: the test files that show it holds; editing their code makes it stale
target = "artifact"
means = "depends"
compare = "lines"           # indentation, how many spaces, blank lines and // comments do not count
ignore = ["//"]
[[book.link]]
name = "checks"             # depends: a changed decision makes its check stale
target = "decision"
count = "at-least-one"
means = "depends"
cover = true                # every decision is expected to have a verification that checks it
[[book.link]]
name = "for"
target = "requirement"
means = "informs"
