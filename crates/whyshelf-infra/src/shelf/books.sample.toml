# A Finding -> Spec -> Design chain, declared as books.
#
# whyshelf knows no kind of document; this is one way a project can declare the
# chain it wants. Copy it to `.whyshelf/books.toml` and change what you need.

[[book]]
name = "finding"
dir = "docs/findings"
key = { prefix = "F" }      # F-1, F-2, F-LATENCY
description = "what was seen or measured, and how it is known"

[[book.field]]
name = "title"
type = "text"
required = true

[[book.field]]
name = "evidence"
type = { enum = ["measured", "observed", "reported", "theoretical"] }
required = true

[[book.field]]
name = "source"
type = "text"

[[book]]
name = "spec"
dir = "docs/specs"
key = { prefix = "S" }
description = "what must hold"

[[book.field]]
name = "title"
type = "text"
required = true

[[book.field]]
name = "pins"               # the names the tests carry to bind the spec
type = "list"

[[book.link]]
name = "grounds"            # a spec stands on its findings: a changed finding makes it stale
target = "finding"
count = "at-least-one"
means = "depends"

[[book.link]]
name = "replaces"           # a spec that takes the place of an older one
target = "spec"
count = "optional"
means = "replaces"

[[book]]
name = "design"
dir = "docs/designs"
key = { prefix = "D" }
description = "how it is built, and why not another way"

[[book.field]]
name = "title"
type = "text"
required = true

[[book.field]]
name = "rejected"           # the options not taken
type = "list"

[[book.link]]
name = "spec"               # a design stands on one spec
target = "spec"
count = "one"
means = "depends"

[[book.link]]
name = "see"                # findings worth reading, which do not make it stale
target = "finding"
means = "informs"

[[book.link]]
name = "tests"              # the tests that show it holds: files, by path; editing one makes it stale
target = "artifact"
space = "file"              # the space its names are in: here the files, by path under the root
means = "depends"
