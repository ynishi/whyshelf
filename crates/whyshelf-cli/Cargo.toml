[package]
name = "whyshelf-cli"
description = "Command-line interface of whyshelf: books of documents whose kinds a project declares, and whether each decision about them still holds"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

[[bin]]
name = "whyshelf"
path = "src/main.rs"

[dependencies]
whyshelf-core.workspace = true
whyshelf-infra.workspace = true
clap.workspace = true
jiff.workspace = true
unicode-width.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
