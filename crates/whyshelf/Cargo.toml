[package]
name = "whyshelf"
description = "Books of documents whose kinds a project declares, linked to the files they stand on, and whether each decision about them still holds"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

[dependencies]
whyshelf-core.workspace = true
whyshelf-infra = { workspace = true, optional = true }

[features]
default = ["infra"]
# The adapters (file system, Git, clock). Off for a caller that brings its own.
infra = ["dep:whyshelf-infra"]
