[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
repository = "https://github.com/ynishi/whyshelf"
homepage = "https://github.com/ynishi/whyshelf"
documentation = "https://docs.rs/whyshelf"
readme = "README.md"

[workspace.dependencies]
whyshelf-core = { path = "crates/whyshelf-core", version = "0.1.0" }
whyshelf-infra = { path = "crates/whyshelf-infra", version = "0.1.0" }
arch-lint = "0.11"
thiserror = { version = "2.0", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.1", default-features = false }
uuid = { version = "1.29", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }
serde_norway = "0.9"
toml = { version = "1.2", default-features = false, features = ["parse", "serde", "std"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
unicode-width = { version = "0.2", default-features = false }
tokio = { version = "1.54", default-features = false }
tempfile = "3.27"
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
